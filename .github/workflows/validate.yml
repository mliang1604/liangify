name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate marketplace, manifests, hooks and frontmatter
        run: python3 .github/scripts/validate_marketplace.py
